name: Validate research trackers

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracker integrity
        run: python scripts/validate_data.py
      - name: Validate proposed Evidence Atlas taxonomy
        run: python scripts/validate_evidence_atlas_taxonomy.py
      - name: Run validation unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify committed Evidence Atlas is reproducible
        run: |
          python scripts/build_evidence_atlas.py --output "$RUNNER_TEMP/evidence-atlas.html"
          cmp experiments/evidence-atlas/index.html "$RUNNER_TEMP/evidence-atlas.html"
      - name: Reproduce Q3 synthetic controls offline
        run: python -m scripts.q3_synthetic --output-dir "$RUNNER_TEMP/q3-synthetic"
