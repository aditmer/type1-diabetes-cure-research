name: Validate research trackers

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracker integrity
        run: python scripts/validate_data.py
      - name: Run validation unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce Q3 synthetic controls offline
        run: python -m scripts.q3_synthetic --output-dir "$RUNNER_TEMP/q3-synthetic"
