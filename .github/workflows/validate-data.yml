name: Validate research trackers

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_data.py"
      - ".github/workflows/validate-data.yml"
  push:
    paths:
      - "data/**"
      - "scripts/validate_data.py"
      - ".github/workflows/validate-data.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_data.py
