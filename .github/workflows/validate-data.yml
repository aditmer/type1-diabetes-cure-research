name: Validate research trackers

on:
  pull_request:
    paths:
      - "data/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-data.yml"
  push:
    paths:
      - "data/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-data.yml"

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracker integrity
        run: python scripts/validate_data.py
      - name: Run validation unit tests
        run: python -m unittest discover -s tests -v
